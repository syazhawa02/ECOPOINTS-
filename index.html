<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EcoPoints – Food Waste Rewards</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
      /* 1. THEME VARIABLES */
    :root {
      --bg: #f4f1e8;
      --card: #fff;
      --ink: #1c2b24;
      --mut: #5d6b63;
      --line: #e3ded0;

      --g1: #1f4d3a;
      --g2: #2e9e6b;
      --g3: #dfe7;

      --warn: #a85b00;
      --wb: #fdeed6;
      --bad: #a3302b;
      --bb: #fbe3e1;

      --side: #1f4d3a;
      --sideink: #e8f5ee;

      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121a16;
        --card: #1b2620;
        --ink: #e8f0eb;
        --mut: #a3b3aa;
        --line: #2c3a32;
        --g1: #6fd0a0;
        --g2: #38b27a;
        --g3: #1f3a2d;
        --wb: #3a2c12;
        --warn: #f0b35c;
        --bb: #40201e;
        --bad: #f09a95;
        --side: #0d1612;
      }
    }

    /*2. BASE */
    * { box-sizing: border-box; }
    html { scroll-padding-top: env(safe-area-inset-top, 0px); }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    h1, h2, h3 { margin: 0 0 .5rem; line-height: 1.2; }
    h1 { font-size: 1.6rem; font-weight: 800; }
    h2 { font-size: 1.1rem; }

    button, input, select, textarea { font: inherit; color: inherit; }

    /* 3. LAYOUT (sidebar + main) */
    .app { display: flex; min-height: 100vh; }

    nav {
      width: 230px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 18px 12px;
      background: var(--side);
      color: var(--sideink);
    }
    nav .brand { font-weight: 800; font-size: 1.25rem; padding: 4px 10px 14px; }
    nav .who   { font-size: .8rem; opacity: .8; padding: 0 10px 12px; }
    nav button {
      background: none;
      border: 0;
      color: inherit;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 500;
    }
    nav button:hover { background: rgba(255, 255, 255, .1); }
    nav button.on    { background: var(--g2); color: #fff; font-weight: 700; }

    main { flex: 1; padding: 24px; max-width: 1100px; min-width: 0; }

    .banner {
      background: var(--wb);
      color: var(--warn);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: .85rem;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-bottom: 18px;
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 150px; }


    /* 4. COMPONENTS*/

    /* --- Cards & stats --- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
    }
    .stat b    { display: block; font-size: 1.6rem; font-weight: 800; color: var(--g1); }
    .stat span { color: var(--mut); font-size: .85rem; }

    .hero {
      background: var(--g1);
      color: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }
    .hero b     { font-size: 2.6rem; font-weight: 800; }
    .hero small { opacity: .85; display: block; }

    /* --- Buttons --- */
    .btn {
      background: var(--g2);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.alt { background: transparent; border: 1.5px solid var(--g2); color: var(--g1); }
    .btn.bad { background: var(--bad); color: #fff; }
    .btn.sm  { padding: 5px 10px; font-size: .82rem; }
    .hero .btn.alt { color: #fff; border-color: #fff; }

    .btn:focus-visible,
    input:focus-visible,
    select:focus-visible,
    nav button:focus-visible {
      outline: 3px solid #f0b35c;
      outline-offset: 2px;
    }

    /* --- Forms --- */
    label { display: block; font-weight: 700; font-size: .85rem; margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: var(--card);
    }
    .err   { color: var(--bad); font-size: .82rem; min-height: 1.1em; }
    .empty { padding: 22px; text-align: center; color: var(--mut); }

    /* --- Tables --- */
    .tw { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td {
      text-align: left;
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    th { color: var(--mut); cursor: pointer; font-weight: 700; }

    /* --- Status tags --- */
    .tag {
      padding: 2px 9px;
      border-radius: 99px;
      font-size: .78rem;
      font-weight: 700;
      background: var(--wb);
      color: var(--warn);
    }
    .tag.Approved, .tag.Redeemed { background: var(--g3); color: var(--g1); }
    .tag.Rejected                { background: var(--bb); color: var(--bad); }

    /* --- Bar chart --- */
    .bars { display: flex; gap: 10px; align-items: flex-end; height: 130px; }
    .bars div { flex: 1; text-align: center; font-size: .75rem; color: var(--mut); }
    .bars i { display: block; background: var(--g2); border-radius: 6px 6px 0 0; min-height: 3px; }

    /* --- Toast & modal --- */
    #toast {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: var(--g1);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      display: none;
      z-index: 9;
    }
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 16px;
    }
    #modal .card { max-width: 400px; width: 100%; }

    /* --- Login screen --- */
    .login { max-width: 560px; margin: 8vh auto; padding: 0 16px; }
    .login .card {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    /* 5. MOBILE */
    @media (max-width: 760px) {
      .app { flex-direction: column; }
      nav { width: 100%; flex-direction: row; flex-wrap: wrap; padding: 10px; }
      nav .brand, nav .who { width: 100%; padding: 0 6px; }
      main { padding: 14px; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="toast" role="status"></div>

  <!-- Confirmation modal (reused for approve / reject / reset) -->
  <div id="modal">
    <div class="card">
      <p id="mq"></p>
      <div id="mx"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn alt" id="mn">Cancel</button>
        <button class="btn" id="my">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    /* 1. HELPERS */
    const STORAGE_KEY = 'ecopoints_v1';
    const $ = s => document.querySelector(s);

    // Escape user text before putting it into HTML
    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

    // ISO date-time string (YYYY-MM-DDTHH:mm) for "n days ago"
    const daysAgo = n => {
      const d = new Date();
      d.setDate(d.getDate() - n);
      return d.toISOString().slice(0, 16);
    };

    // Weights are rounded half-up to 0.1 kg
    const round1 = x => Math.round((x + Number.EPSILON) * 10) / 10;

    const sum    = (arr, fn) => arr.reduce((total, item) => total + fn(item), 0);
    const fmt    = iso => iso.replace('T', ' ');
    const month  = iso => iso.slice(0, 7);
    const money  = n => 'RM ' + (+n).toFixed(2);


    /* 2. DATA (sample seed + localStorage) */
    function seed() {
      return {
        v: 1,

        // Conversion rules (editable by admin)
        cfg: { kgPerPt: 1, rewardShare: 50, rmPerFundPt: 1 },

        users: [
          { id: 'RES-1001', name: 'Aisyah Rahman',       role: 'resident', unit: 'Block A-12-03' },
          { id: 'RES-1002', name: 'Daniel Lim',          role: 'resident', unit: 'Block B-05-11' },
          { id: 'WRK-01',   name: 'Hakim Abdullah',      role: 'worker',   unit: 'Block A Centre' },
          { id: 'ADM-01',   name: 'Farah Property Mgmt', role: 'admin',    unit: 'Office' }
        ],

        centres: [
          'Block A – Ground Floor',
          'Block B – Ground Floor',
          'Block A – Level 5 (floor hub)'
        ],

        // Bills residents can pay with points
        bills: [
           { id: 'B1', name: 'Facility fee', ptsPerRM: 1, on: 1 },
           { id: 'B2', name: 'Water bill',   ptsPerRM: 1, on: 1 },
           { id: 'B3', name: 'Parking fee',  ptsPerRM: 12, on: 0 }
        ],

        // Weight submissions (sub = submitted kg, ver = verified kg)
        subs: [
          { id: 'S1', uid: 'RES-1001', centre: 0, at: daysAgo(70), sub: 3.2, ver: 3.2,  st: 'Approved', pts: 3, by: 'WRK-01' },
          { id: 'S2', uid: 'RES-1001', centre: 0, at: daysAgo(40), sub: 5,   ver: 4.8,  st: 'Approved', pts: 4, by: 'WRK-01' },
          { id: 'S3', uid: 'RES-1001', centre: 0, at: daysAgo(12), sub: 6.5, ver: 6.5,  st: 'Approved', pts: 6, by: 'WRK-01' },
          { id: 'S4', uid: 'RES-1002', centre: 1, at: daysAgo(20), sub: 8,   ver: 8,    st: 'Approved', pts: 8, by: 'WRK-01' },
          { id: 'S5', uid: 'RES-1002', centre: 1, at: daysAgo(5),  sub: 2,   ver: null, st: 'Rejected', reason: 'Weight did not match scale', by: 'WRK-01' },
          { id: 'S6', uid: 'RES-1002', centre: 1, at: daysAgo(0),  sub: 4.5, ver: null, st: 'Pending Verification' }
        ],

        // Redemption requests
        reds: [
          { id: 'R1', uid: 'RES-1001', bill: 'B1', rm: 0.5, pts: 5, at: daysAgo(8), st: 'Redeemed' }
        ],

        // Fertiliser sales ledger
        sales: [
          { id: 'F1', at: daysAgo(15).slice(0, 10), batch: 'Batch 01 (sample)',
          bags: 40, rev: 420, cost: 230, profit: 190, elig: 95, fpts: 95, rem: 0, fac: 95 }
        ],

        // Worker transfers to processing centre
        transfers: [
          { id: 'T1', at: daysAgo(10), kg: 10, to: 'Processing Centre (sample)' }
        ],

        audit: [],

        ann: [
          'Sample announcement: Collection hubs open 7am–9pm daily.',
          'Sample announcement: Redemption rates are set by management and may change.'
        ]
      };
    }

    // Load saved data (or start from the sample seed)
    let db;
    try { db = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}
    if (!db || db.v !== 1) db = seed();

    const save = () => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
    };


    /* 3. APP STATE */
    let me = null;            // signed-in user
    let view = '';            // current page key
    let q = '';               // search text (worker queue)
    let toastTimer = null;


    /* 4. UI UTILITIES */

    // Record an action in the audit log
    const log = action => {
      db.audit.unshift({
        at: new Date().toISOString().slice(0, 16),
        who: me ? me.id : '-',
        a: action
      });
      save();
    };

    // Small popup message
    function toast(message) {
      const t = $('#toast');
      t.textContent = message;
      t.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.style.display = 'none', 2600);
    }

    // Confirmation modal. If `extra` HTML has an <input>, a reason is required.
    function ask(message, extra, onConfirm) {
      $('#mq').textContent = message;
      $('#mx').innerHTML = extra || '';
      $('#modal').style.display = 'flex';

      $('#mn').onclick = () => $('#modal').style.display = 'none';
      $('#my').onclick = () => {
        const value = $('#mx input') ? $('#mx input').value.trim() : '';
        if (extra && !value) { toast('A reason is required'); return; }
        $('#modal').style.display = 'none';
        onConfirm(value);
      };
    }

    // Build an HTML table. cols = [[heading, (row) => html], ...]
    function table(cols, rows, emptyText) {
      if (!rows.length) return `<div class="empty">${emptyText}</div>`;
      return `<div class="tw"><table>
        <tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>
        ${rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}
      </table></div>`;
    }

    const tag  = status => `<span class="tag ${status}">${status}</span>`;
    const stat = (value, label) => `<div class="card stat"><b>${value}</b><span>${label}</span></div>`;

    // Attach a submit handler to #f; the handler returns an error string (or nothing)
    const form = handler => {
      const f = $('#f');
      if (f) f.onsubmit = e => {
        e.preventDefault();
        const error = handler();
        $('#e').textContent = error || '';
      };
    };


    /* 5. CALCULATIONS*/
    const userById = id => db.users.find(u => u.id === id) || { name: '?' };

    // Points a resident has earned / spent / currently holding in pending requests
    const earned = uid => db.subs.filter(s => s.uid === uid && s.st === 'Approved').reduce((a, s) => a + s.pts, 0);
    const spent  = uid => db.reds.filter(r => r.uid === uid && r.st === 'Redeemed').reduce((a, r) => a + r.pts, 0);
    const held   = uid => db.reds.filter(r => r.uid === uid && r.st === 'Pending').reduce((a, r) => a + r.pts, 0);

    // Verified kg for one resident / for everyone
    const kgOf  = uid => round1(db.subs.filter(s => s.uid === uid && s.st === 'Approved').reduce((a, s) => a + s.ver, 0));
    const allKg = () => round1(sum(db.subs.filter(s => s.st === 'Approved'), s => s.ver));

    // Kg collected but not yet moved to the processing centre
    const awaiting = () => round1(allKg() - sum(db.transfers, t => t.kg));


    /*6. SHARED VIEW PIECES */

    // Last 6 months of verified kg for one resident
    function bars(uid) {
      const perMonth = {};
      for (let i = 5; i >= 0; i--) {
        const d = new Date();
        d.setDate(1);
        d.setMonth(d.getMonth() - i);
        perMonth[d.toISOString().slice(0, 7)] = 0;
      }

      db.subs
        .filter(s => s.uid === uid && s.st === 'Approved')
        .forEach(s => { if (month(s.at) in perMonth) perMonth[month(s.at)] += s.ver; });

      const max = Math.max(1, ...Object.values(perMonth));

      return `<div class="bars" role="img" aria-label="Verified kg per month">
        ${Object.entries(perMonth).map(([k, v]) =>
          `<div>${round1(v)}<i style="height:${v / max * 90}px"></i>${k.slice(5)}</div>`
        ).join('')}
      </div>`;
    }

    // A resident's submission history table
    const history = uid => table([
      ['Date',         s => fmt(s.at)],
      ['Centre',       s => esc(db.centres[s.centre])],
      ['Submitted kg', s => s.sub],
      ['Verified kg',  s => s.ver ?? '–'],
      ['Points',       s => s.st === 'Approved' ? '+' + s.pts : '–'],
      ['Status',       s => tag(s.st) + (s.reason ? ` <small>${esc(s.reason)}</small>` : '')]
    ],
    db.subs.filter(s => s.uid === uid).sort((a, b) => b.at.localeCompare(a.at)),
    'No submissions yet. Weigh your food waste at a centre, then submit the weight.');


    /* 7. NAVIGATION (menu items per role) */
    const NAV = {
      resident: [
        ['dash',   'Dashboard'],
        ['submit', 'Submit weight'],
        ['hist',   'Recycling history'],
        ['redeem', 'Redeem points']
      ],
      worker: [
        ['queue',    'Verification queue'],
        ['transfer', 'Transfers']
      ],
      admin: [
        ['ov',   'Overview'],
        ['subs', 'All transactions'],
        ['reds', 'Redemptions'],
        ['fin',  'Fertiliser & funds'],
        ['rep',  'Monthly reports'],
        ['set',  'Settings & accounts']
      ]
    };



    /* 8. SCREENS: login + main shell*/
    function login() {
      $('#root').innerHTML = `
        <div class="login">
          <h1>🌿 EcoPoints</h1>
          <p>Recycle food waste, earn points, and help fund your community facilities. Choose a demo account to explore.</p>
        
          ${db.users.map(u => `
            <div class="card">
              <div><b>${esc(u.name)}</b><br><small>${u.role} · ${u.id}</small></div>
              <button class="btn" data-u="${u.id}">Sign in</button>
            </div>`).join('')}

          <button class="btn alt sm" id="rs">Reset sample data</button>
        </div>`;

      document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
        me = userById(b.dataset.u);
        view = NAV[me.role][0][0];
        draw();
      });

      $('#rs').onclick = () => ask('Reset all data to the original samples?', '', () => {
        db = seed();
        save();
        toast('Data reset');
        login();
      });
    }

    // Draw sidebar + current page, then wire up that page's buttons/forms
    function draw() {
      if (!me) return login();

      $('#root').innerHTML = `
        <div class="app">
          <nav>
            <div class="brand">🌿 EcoPoints</div>
            <div class="who">${esc(me.name)}<br>${me.role}</div>
            ${NAV[me.role].map(n => `<button data-v="${n[0]}" class="${n[0] === view ? 'on' : ''}">${n[1]}</button>`).join('')}
            <button id="out" style="margin-top:auto">Sign out</button>
          </nav>
          <main>
            <div class="banner">Sample data for demonstration. Figures are not real business data.</div>
            <div id="pg"></div>
          </main>
        </div>`;

      document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
        view = b.dataset.v;
        q = '';
        draw();
      });
      $('#out').onclick = () => { me = null; login(); };

      $('#pg').innerHTML = PAGES[view]();
      if (WIRE[view]) WIRE[view]();
    }


    /* 9. PAGES (each returns HTML)*/
    const PAGES = {

      /* ---------- RESIDENT ---------- */

      dash() {
        const u = me.id;
        const totalEarned = earned(u);
        const totalSpent  = spent(u);
        const pending = db.subs.filter(s => s.uid === u && s.st === 'Pending Verification').length;

        return `
          <h1>Welcome, ${esc(me.name.split(' ')[0])}</h1>

          <div class="hero">
            <div>
              <small>EcoPoints balance</small>
              <b>${totalEarned - totalSpent}</b>
              <small>${held(u) ? held(u) + ' pts held for pending redemptions' : 'Ready to redeem'}</small>
            </div>
            <div class="row" style="flex:0 0 auto">
              <button class="btn" style="background:#fff;color:#1f4d3a" data-go="submit">Submit weight</button>
              <button class="btn alt" data-go="redeem">Redeem points</button>
            </div>
          </div>

          <div class="grid">
            ${stat(kgOf(u) + ' kg', 'Verified food waste recycled')}
            ${stat(totalEarned, 'Total points earned')}
            ${stat(totalSpent, 'Total points redeemed')}
            ${stat(pending, 'Pending submissions')}
          </div>

          <div class="row">
            <div class="card">
              <h2>Recycling progress (kg per month)</h2>
              ${bars(u)}
            </div>
            <div class="card">
              <h2>Announcements</h2>
              ${db.ann.map(a => `<p>${esc(a)}</p>`).join('')}
              <p><small>Community recycled so far: ${allKg()} kg</small></p>
            </div>
          </div>

          <div class="card" style="margin-top:14px">
            <h2>Recent activity</h2>
            ${history(u).split('</table>')[0] + (db.subs.some(s => s.uid === u) ? '</table></div>' : '')}
          </div>`;
      },

      submit() {
        // Current local time for the date picker default
        const now = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

        return `
          <h1>Submit food waste weight</h1>
          <div class="card" style="max-width:520px">
            <p>Enter the weight shown on the scale by the collection worker. Points are awarded only after the worker verifies it.</p>
            <form id="f" novalidate>
              <label>Resident ID</label>
              <input value="${me.id}" disabled>

              <label for="c">Collection centre</label>
              <select id="c">${db.centres.map((c, i) => `<option value="${i}">${esc(c)}</option>`).join('')}</select>

              <label for="t">Date and time</label>
              <input id="t" type="datetime-local" value="${now}">

              <label for="w">Measured weight (kg)</label>
              <input id="w" type="number" step="0.1" min="0.1" max="50" inputmode="decimal">

              <div class="err" id="e"></div>
              <button class="btn">Submit weight</button>
            </form>
          </div>

          <h2 style="margin-top:18px">Your submissions</h2>
          <div class="card">${history(me.id)}</div>`;
      },

      hist() {
        return `<h1>Recycling history</h1><div class="card">${history(me.id)}</div>`;
      },

      redeem() {
        const u = me.id;
        const available = earned(u) - spent(u) - held(u);
        const openBills = db.bills.filter(b => b.on);

        return `
          <h1>Redeem points</h1>
          <div class="grid">
            ${stat(available, 'Available points')}
            ${stat(held(u), 'Held for pending requests')}
          </div>

          <div class="card" style="max-width:520px">
            <p>Management sets the rates below. Points are deducted only when your request is approved.</p>
            <form id="f" novalidate>
              <label for="b">Bill category</label>
              <select id="b">
                ${openBills.map(b => `<option value="${b.id}">${esc(b.name)} – ${b.ptsPerRM} pts per RM1</option>`).join('')}
              </select>

              <label for="a">Reduction requested (RM)</label>
              <input id="a" type="number" step="0.5" min="0.5" inputmode="decimal">

              <div class="err" id="e"></div>
              ${openBills.length
                ? '<button class="btn">Request redemption</button>'
                : '<div class="empty">No bill categories are open for redemption right now.</div>'}
            </form>
          </div>

          <h2 style="margin-top:18px">Redemption history</h2>
          <div class="card">
            ${table([
              ['Date',   r => fmt(r.at)],
              ['Bill',   r => esc(db.bills.find(b => b.id === r.bill).name)],
              ['Amount', r => money(r.rm)],
              ['Points', r => r.pts],
              ['Status', r => tag(r.st === 'Pending' ? 'Pending Verification' : r.st)]
            ],
            db.reds.filter(r => r.uid === u).sort((a, b) => b.at.localeCompare(a.at)),
            'No redemptions yet.')}
          </div>`;
      },


      /* ---------- WORKER ---------- */

      queue() {
        const pending = db.subs.filter(s => s.st === 'Pending Verification');
        const today = new Date().toISOString().slice(0, 10);
        const approvedToday = db.subs.filter(s => s.st === 'Approved' && s.at.slice(0, 10) === today);

        // Search by name/ID, pending items first, newest first
        const rows = db.subs
          .filter(s => (userById(s.uid).name + s.uid).toLowerCase().includes(q.toLowerCase()))
          .sort((a, b) =>
            (a.st === 'Pending Verification' ? 0 : 1) - (b.st === 'Pending Verification' ? 0 : 1)
            || b.at.localeCompare(a.at));

        return `
          <h1>Verification queue</h1>
          <div class="grid">
            ${stat(round1(sum(approvedToday, s => s.ver)) + ' kg', 'Collected today')}
            ${stat(approvedToday.length, 'Approved today')}
            ${stat(pending.length, 'Pending verification')}
            ${stat(awaiting() + ' kg', 'Awaiting transport')}
          </div>

          <div class="card">
            <label for="q">Search resident name or ID</label>
            <input id="q" value="${esc(q)}" placeholder="e.g. RES-1002">
            <div style="height:10px"></div>

            ${table([
              ['Resident',     s => esc(userById(s.uid).name) + '<br><small>' + s.uid + '</small>'],
              ['Centre',       s => esc(db.centres[s.centre])],
              ['Submitted',    s => fmt(s.at)],
              ['Submitted kg', s => s.sub],
              ['Verified kg',  s => s.st === 'Pending Verification'
                                      ? `<input type="number" step="0.1" min="0.1" max="50" style="width:90px" id="m${s.id}" value="${s.sub}">`
                                      : (s.ver ?? '–')],
              ['Status',       s => tag(s.st)],
              ['Action',       s => s.st === 'Pending Verification'
                                      ? `<button class="btn sm" data-ap="${s.id}">Approve</button> <button class="btn bad sm" data-rj="${s.id}">Reject</button>`
                                      : '']
            ], rows, 'No matching submissions.')}
          </div>`;
      },

      transfer() {
        return `
          <h1>Transfers to processing centre</h1>
          <div class="grid">${stat(awaiting() + ' kg', 'Awaiting transport')}</div>

          <div class="card" style="max-width:520px">
            <form id="f" novalidate>
              <label for="k">Weight loaded (kg)</label>
              <input id="k" type="number" step="0.1" min="0.1" max="${awaiting()}">
              <div class="err" id="e"></div>
              <button class="btn">Record transfer</button>
            </form>
          </div>

          <h2 style="margin-top:18px">Transfer log</h2>
          <div class="card">
            ${table([
              ['Date',        t => fmt(t.at)],
              ['Weight',      t => t.kg + ' kg'],
              ['Destination', t => esc(t.to)]
            ], [...db.transfers].reverse(), 'No transfers recorded.')}
          </div>`;
      },


      /* ---------- ADMIN ---------- */

      ov() {
        const issued   = sum(db.subs.filter(s => s.st === 'Approved'), s => s.pts);
        const redeemed = sum(db.reds.filter(r => r.st === 'Redeemed'), r => r.pts);
        const funded   = sum(db.sales, s => s.fpts);

        return `
          <h1>Overview</h1>
          <div class="grid">
            ${stat(db.users.filter(u => u.role === 'resident').length, 'Registered residents')}
            ${stat(allKg() + ' kg', 'Food waste recycled')}
            ${stat(sum(db.sales, s => s.bags * 25) / 1000 + ' t', 'Fertiliser produced (25 kg bags)')}
            ${stat(money(sum(db.sales, s => s.rev)), 'Fertiliser sales revenue')}
            ${stat(money(sum(db.sales, s => s.cost)), 'Processing and transport costs')}
            ${stat(money(sum(db.sales, s => s.profit)), 'Net profit')}
            ${stat(funded, 'Reward fund (points funded)')}
            ${stat(issued, 'Resident points issued')}
            ${stat(redeemed, 'Points redeemed')}
            ${stat(money(sum(db.sales, s => s.fac)), 'Allocated to facilities')}
          </div>

          <div class="card">
            <h2>Reward fund balance</h2>
            <p>Funded ${funded} pts − issued ${issued} pts = <b>${funded - issued} pts</b>
               ${funded - issued < 0 ? '(issued points exceed funding; review rates)' : ''}</p>
            <p><small>Resident points come from verified kg. Fertiliser profit separately funds the reward pool. The two are never double-counted.</small></p>
          </div>`;
      },

      subs() {
        return `
          <h1>All transactions</h1>
          <div class="card">
            ${table([
              ['ID',       s => s.id],
              ['Resident', s => esc(userById(s.uid).name)],
              ['Date',     s => fmt(s.at)],
              ['Submitted', s => s.sub],
              ['Verified', s => s.ver ?? '–'],
              ['Points',   s => s.pts ?? '–'],
              ['Status',   s => tag(s.st)]
            ], [...db.subs].sort((a, b) => b.at.localeCompare(a.at)), 'No transactions.')}
          </div>`;
      },

      reds() {
        return `
          <h1>Redemption requests</h1>
          <div class="card">
            ${table([
              ['Resident', r => esc(userById(r.uid).name)],
              ['Bill',     r => esc(db.bills.find(b => b.id === r.bill).name)],
              ['RM',       r => (+r.rm).toFixed(2)],
              ['Points',   r => r.pts],
              ['Status',   r => tag(r.st === 'Pending' ? 'Pending Verification' : r.st)],
              ['Action',   r => r.st === 'Pending'
                                  ? `<button class="btn sm" data-ra="${r.id}">Approve</button> <button class="btn bad sm" data-rr="${r.id}">Reject</button>`
                                  : '']
            ], [...db.reds].reverse(), 'No redemption requests.')}
          </div>`;
      },

      fin() {
        return `
          <h1>Fertiliser sales and fund allocation</h1>
          <div class="card" style="max-width:640px">
            <p>Profit = revenue − costs. Reward share (${db.cfg.rewardShare}%) of profit funds points at RM${db.cfg.rmPerFundPt} per point; any remainder stays in the ledger. The rest of the profit goes to facilities.</p>
            <form id="f" novalidate>
              <div class="row">
                <div><label for="n">Batch name</label><input id="n"></div>
                <div><label for="g">Bags (25 kg)</label><input id="g" type="number" min="0"></div>
              </div>
              <div class="row">
                <div><label for="v">Sales revenue (RM)</label><input id="v" type="number" step="0.01" min="0"></div>
                <div><label for="o">Processing + transport cost (RM)</label><input id="o" type="number" step="0.01" min="0"></div>
              </div>
              <div class="err" id="e"></div>
              <button class="btn">Record sale</button>
            </form>
          </div>

          <h2 style="margin-top:18px">Financial ledger</h2>
          <div class="card">
            ${table([
              ['Date',         s => s.at],
              ['Batch',        s => esc(s.batch)],
              ['Revenue',      s => money(s.rev)],
              ['Cost',         s => money(s.cost)],
              ['Profit',       s => money(s.profit)],
              ['Funds points', s => s.fpts],
              ['Remainder',    s => money(s.rem)],
              ['Facilities',   s => money(s.fac)]
            ], [...db.sales].reverse(), 'No sales recorded.')}
          </div>`;
      },

      rep() {
        // Group everything by month
        const byMonth = {};
        const get = k => byMonth[k] = byMonth[k] || { kg: 0, iss: 0, red: 0, profit: 0, fac: 0 };

        db.subs.filter(s => s.st === 'Approved').forEach(s => {
          get(month(s.at)).kg  += s.ver;
          get(month(s.at)).iss += s.pts;
        });
        db.reds.filter(r => r.st === 'Redeemed').forEach(r => get(month(r.at)).red += r.pts);
        db.sales.forEach(s => {
          get(month(s.at)).profit += s.profit;
          get(month(s.at)).fac    += s.fac;
        });

        const rows = Object.entries(byMonth).sort().reverse().map(([k, v]) => ({ k, ...v }));

        return `
          <h1>Monthly reports</h1>
          <div class="card">
            ${table([
              ['Month',           r => r.k],
              ['Food waste (kg)', r => round1(r.kg)],
              ['Points issued',   r => r.iss],
              ['Points redeemed', r => r.red],
              ['Net profit',      r => money(r.profit)],
              ['To facilities',   r => money(r.fac)]
            ], rows, 'No data yet.')}
          </div>

          <h2 style="margin-top:18px">Audit log</h2>
          <div class="card">
            ${table([
              ['When',   a => a.at],
              ['Who',    a => a.who],
              ['Action', a => esc(a.a)]
            ], db.audit.slice(0, 15), 'No actions logged yet.')}
          </div>`;
      },

      set() {
        const c = db.cfg;

        return `
          <h1>Settings and accounts</h1>

          <div class="row">
            <!-- Conversion rules -->
            <div class="card">
              <h2>Conversion rules</h2>
              <form id="cf" novalidate>
                <label for="k1">Points per verified kg</label>
                <input id="k1" type="number" step="0.1" min="0" value="${c.kgPerPt}">

                <label for="k2">Reward share of profit (%)</label>
                <input id="k2" type="number" min="0" max="100" value="${c.rewardShare}">

                <label for="k3">RM of profit per funded point</label>
                <input id="k3" type="number" step="0.5" min="0.5" value="${c.rmPerFundPt}">

                <div class="err" id="e"></div>
                <button class="btn">Save rules</button>
              </form>
              <p><small>Whole points only: verified kg × rate, rounded down. Weights are stored to 0.1 kg.</small></p>
            </div>

            <!-- Redeemable bills -->
            <div class="card">
              <h2>Redeemable bills</h2>
              <p><small>Points needed per RM1 are not finalised; the values shown are samples.</small></p>
              ${db.bills.map(b => `
                <div class="row" style="align-items:end">
                  <div>
                    <label>${esc(b.name)} (pts per RM1)</label>
                    <input type="number" min="1" data-bp="${b.id}" value="${b.ptsPerRM}">
                  </div>
                  <div style="flex:0 0 90px">
                    <label>Open</label>
                    <input type="checkbox" data-bo="${b.id}" ${b.on ? 'checked' : ''} style="width:auto">
                  </div>
                </div>`).join('')}
              <button class="btn sm" id="sb" style="margin-top:10px">Save bills</button>
            </div>
          </div>

          <!-- Collection centres -->
          <div class="card" style="margin-top:14px">
            <h2>Collection centres</h2>
            <p>${db.centres.map(esc).join(' · ')}</p>
            <div class="row">
              <input id="nc" placeholder="New centre or block name">
              <button class="btn sm" id="ac" style="flex:0 0 120px">Add centre</button>
            </div>
          </div>

          <!-- Accounts -->
          <h2 style="margin-top:18px">Accounts</h2>
          <div class="card">
            ${table([
              ['ID',       u => u.id],
              ['Name',     u => esc(u.name)],
              ['Role',     u => u.role],
              ['Location', u => esc(u.unit)]
            ], db.users, 'No accounts.')}
            <div class="row" style="margin-top:12px">
              <input id="un" placeholder="Name">
              <select id="ur"><option>resident</option><option>worker</option></select>
              <button class="btn sm" id="au" style="flex:0 0 120px">Add account</button>
            </div>
          </div>`;
      }
    };


    /*10. WIRING (event handlers for each page)*/
    const WIRE = {

      /* ---------- RESIDENT ---------- */

      dash() {
        document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
          view = b.dataset.go;
          draw();
        });
      },

      submit() {
        form(() => {
          const weight = round1(parseFloat($('#w').value));
          const time   = $('#t').value;
          const centre = +$('#c').value;

          if (!(weight >= 0.1 && weight <= 50)) return 'Enter a weight between 0.1 and 50 kg.';
          if (!time || new Date(time) > new Date(Date.now() + 6e4)) return 'Choose a date and time that is not in the future.';

          // Block accidental double submissions (same centre, weight, within 2 minutes)
          const duplicate = db.subs.some(s =>
            s.uid === me.id && s.centre === centre && s.sub === weight &&
            Math.abs(new Date(s.at) - new Date(time)) < 12e4);
          if (duplicate) return 'This weight was already submitted for that time.';

          db.subs.push({
            id: 'S' + Date.now(),
            uid: me.id,
            centre,
            at: time,
            sub: weight,
            ver: null,
            st: 'Pending Verification'
          });
          log('Submitted ' + weight + ' kg');
          toast('Submitted. A worker will verify it.');
          view = 'hist';
          draw();
        });
      },

      hist() {},

      redeem() {
        form(() => {
          const bill   = db.bills.find(x => x.id === $('#b').value);
          const amount = parseFloat($('#a').value);
          if (!(amount > 0)) return 'Enter an amount greater than RM0.';

          const pts       = Math.ceil(amount * bill.ptsPerRM);
          const available = earned(me.id) - spent(me.id) - held(me.id);
          if (pts > available) return `You need ${pts} points but have ${available} available.`;

          db.reds.push({
            id: 'R' + Date.now(),
            uid: me.id,
            bill: bill.id,
            rm: amount,
            pts,
            at: new Date().toISOString().slice(0, 16),
            st: 'Pending'
          });
          log('Redemption request ' + pts + ' pts');
          toast('Request sent for approval.');
          draw();
        });
      },


      /* ---------- WORKER ---------- */

      queue() {
        // Live search (keeps the cursor position after redraw)
        $('#q').oninput = e => {
          q = e.target.value;
          const pos = e.target.selectionStart;
          draw();
          const box = $('#q');
          box.focus();
          box.setSelectionRange(pos, pos);
        };

        // Approve (with optional weight correction)
        document.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => {
          const s = db.subs.find(x => x.id === b.dataset.ap);
          const measured = round1(parseFloat($('#m' + s.id).value));
          if (!(measured >= 0.1 && measured <= 50)) return toast('Enter the measured weight (0.1–50 kg).');

          const pts = Math.floor(measured * db.cfg.kgPerPt + 1e-9);
          const corrected = measured !== s.sub;

          ask(
            `Approve ${userById(s.uid).name}: verified ${measured} kg = ${pts} points.` +
            (corrected ? ' Measured weight differs from the submitted ' + s.sub + ' kg and will be recorded as corrected.' : ''),
            '',
            () => {
              if (s.st !== 'Pending Verification') return;
              s.ver = measured;
              s.pts = pts;
              s.st  = 'Approved';
              s.by  = me.id;
              log((corrected ? 'Corrected & approved ' : 'Approved ') + s.id + ' at ' + measured + ' kg, +' + pts + ' pts');
              toast('Approved. ' + pts + ' points awarded.');
              draw();
            }
          );
        });

        // Reject (reason required)
        document.querySelectorAll('[data-rj]').forEach(b => b.onclick = () => {
          const s = db.subs.find(x => x.id === b.dataset.rj);
          ask('Reject this submission? Enter a reason.', '<label>Reason</label><input>', reason => {
            if (s.st !== 'Pending Verification') return;
            s.st = 'Rejected';
            s.reason = reason;
            s.by = me.id;
            log('Rejected ' + s.id + ': ' + reason);
            toast('Submission rejected.');
            draw();
          });
        });
      },

      transfer() {
        form(() => {
          const kg = round1(parseFloat($('#k').value));
          if (!(kg > 0)) return 'Enter a weight above 0.';
          if (kg > awaiting()) return `Only ${awaiting()} kg is awaiting transport.`;

          db.transfers.push({
            id: 'T' + Date.now(),
            at: new Date().toISOString().slice(0, 16),
            kg,
            to: 'Processing Centre (sample)'
          });
          log('Transfer ' + kg + ' kg');
          toast('Transfer recorded.');
          draw();
        });
      },


      /* ---------- ADMIN ---------- */

      reds() {
        // Approve redemption (deducts points)
        document.querySelectorAll('[data-ra]').forEach(b => b.onclick = () => {
          const r = db.reds.find(x => x.id === b.dataset.ra);
          const available = earned(r.uid) - spent(r.uid);
          if (r.pts > available) return toast('Resident no longer has enough points.');

          ask(`Approve and deduct ${r.pts} points from ${userById(r.uid).name}?`, '', () => {
            if (r.st !== 'Pending') return;
            r.st = 'Redeemed';
            log('Redeemed ' + r.id + ' −' + r.pts + ' pts');
            toast('Redemption approved.');
            draw();
          });
        });

        // Reject redemption (no deduction)
        document.querySelectorAll('[data-rr]').forEach(b => b.onclick = () => {
          const r = db.reds.find(x => x.id === b.dataset.rr);
          ask('Reject this request? No points will be deducted.', '', () => {
            if (r.st !== 'Pending') return;
            r.st = 'Rejected';
            log('Rejected ' + r.id);
            draw();
          });
        });
      },

      fin() {
        form(() => {
          const revenue = parseFloat($('#v').value);
          const cost    = parseFloat($('#o').value);
          const bags    = parseInt($('#g').value || 0);
          const batch   = $('#n').value.trim();

          if (!batch) return 'Enter a batch name.';
          if (!(revenue >= 0) || !(cost >= 0)) return 'Enter revenue and cost as numbers (0 or more).';

          const profit   = Math.max(0, +(revenue - cost).toFixed(2));
          const eligible = +(profit * db.cfg.rewardShare / 100).toFixed(2);          // share that funds rewards
          const fpts     = Math.floor(eligible / db.cfg.rmPerFundPt + 1e-9);         // whole points funded
          const rem      = +(eligible - fpts * db.cfg.rmPerFundPt).toFixed(2);       // leftover stays in ledger

          db.sales.push({
            id: 'F' + Date.now(),
            at: new Date().toISOString().slice(0, 10),
            batch,
            bags: bags || 0,
            rev: revenue,
            cost,
            profit,
            elig: eligible,
            fpts,
            rem,
            fac: +(profit - eligible).toFixed(2)   // remaining profit goes to facilities
          });
          log('Sale ' + batch + ' profit RM' + profit);
          toast(`Recorded. ${fpts} points funded, RM${rem} kept in ledger.`);
          draw();
        });
      },

      set() {
        // Save conversion rules
        $('#cf').onsubmit = e => {
          e.preventDefault();
          const kgPerPt     = parseFloat($('#k1').value);
          const rewardShare = parseFloat($('#k2').value);
          const rmPerFundPt = parseFloat($('#k3').value);

          if (!(kgPerPt >= 0) || !(rewardShare >= 0 && rewardShare <= 100) || !(rmPerFundPt > 0)) {
            $('#e').textContent = 'Check values: share must be 0–100 and RM per point above 0.';
            return;
          }
          db.cfg = { kgPerPt, rewardShare, rmPerFundPt };
          log('Rules updated');
          toast('Rules saved.');
          draw();
        };

        // Save bill rates + open/closed flags
        $('#sb').onclick = () => {
          db.bills.forEach(b => {
            const rate = parseInt(document.querySelector(`[data-bp="${b.id}"]`).value);
            if (rate > 0) b.ptsPerRM = rate;
            b.on = document.querySelector(`[data-bo="${b.id}"]`).checked ? 1 : 0;
          });
          log('Bills updated');
          toast('Bills saved.');
        };

        // Add collection centre
        $('#ac').onclick = () => {
          const name = $('#nc').value.trim();
          if (!name) return toast('Enter a centre name.');
          db.centres.push(name);
          log('Centre added');
          draw();
        };

        // Add account
        $('#au').onclick = () => {
          const name = $('#un').value.trim();
          if (!name) return toast('Enter a name.');
          const role = $('#ur').value;
          db.users.push({
            id: (role === 'worker' ? 'WRK-' : 'RES-') + (1000 + db.users.length),
            name,
            role,
            unit: 'New'
          });
          log('Account added');
          draw();
        };
      }
    };


    /* 11. START*/
    login();
  </script>
</body>
</html>
